<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>短视频创作工作台</title>
  <style>
    :root{--bg:#f4f7f9;--surface:#fff;--ink:#16232c;--muted:#6d7b83;--line:#dce5e8;--brand:#0b7d85;--brand-strong:#075b62;--brand-soft:#e3f3f2;--orange:#ed8a38;--danger:#b84242;--success:#277b56;--shadow:0 12px 32px rgba(29,55,64,.08)}
    *{box-sizing:border-box}body{margin:0;min-width:1080px;background:var(--bg);color:var(--ink);font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);min-height:36px;padding:0 13px;cursor:pointer}button:hover{border-color:#a8c3c6;background:#f6fbfb}button.primary{border-color:var(--brand);background:var(--brand);color:#fff}button.primary:hover{background:var(--brand-strong)}button.subtle{border-color:transparent;background:transparent;color:var(--muted)}button.ghost{background:var(--brand-soft);border-color:transparent;color:var(--brand-strong)}button.danger{color:var(--danger)}button:disabled{opacity:.46;cursor:not-allowed}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);outline:0;padding:9px 10px}input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,125,133,.1)}textarea{resize:vertical;min-height:90px}.app{min-height:100vh;display:grid;grid-template-rows:64px 48px 1fr}.topbar{display:flex;align-items:center;gap:20px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;min-width:245px}.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;font-weight:800}.brand strong{display:block;font-size:15px}.brand span{display:block;margin-top:1px;color:var(--muted);font-size:11px}.workspace{display:flex;align-items:center;gap:8px;flex:1;max-width:720px}.workspace input{height:34px;min-width:0}.workspace button{min-height:34px;padding:0 12px}.runtime{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#a9b4b8}.dot.ready{background:var(--success)}.nav{display:flex;align-items:center;gap:4px;padding:0 2 w);transform:translateY(-1px)}.template-visual{height:86px;border-radius:7px;margin-bottom:14px;padding:13px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(135deg,#0d1928,#1b4860)}.template-visual.minimal{color:#174060;background:linear-gradient(135deg,#f4f9fd,#d9e8ef)}.template-visual.map{background:linear-gradient(135deg,#123f5a,#098789)}.template-visual.photo{background:linear-gradient(135deg,#54516c,#ce7b79)}.template-visual small{font-size:10px;opacity:.75}.template-visual strong{font-size:17px}.template-card h3{margin:0 0 6px;font-size:15px}.template-card p{min-height:42px;margin:0;color:var(--muted);font-size:12px}.template-meta{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 15px}.tag{display:inline-flex;align-items:center;height:23px;padding:0 7px;border-radius:4px;background:#f0f4f5;color:#5d6b71;font-size:11px}.tag.accent{background:var(--brand-soft);color:var(--brand-strong)}.template-card button{margin-top:auto;width:100%}.project-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.project-card{display:flex;align-items:center;gap:13px;min-width:0;padding:14px 15px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-align:left}.project-card:hover{border-color:#9cc4c5}.project-card .project-icon{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:8px;background:#eff6f6;color:var(--brand-strong);font-weight:800}.project-card div:nth-child(2){min-width:0;flex:1}.project-card strong,.project-card span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-card span{margin-top:3px;color:var(--muted);font-size:11px}.empty-line{padding:26px;color:var(--muted);border:1px dashed var(--line);border-radius:9px;text-align:center;background:rgba(255,255,255,.5)}.project-layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 112px)}.project-sidebar{border-right:1px solid var(--line);background:var(--surface);padding:19px 13px}.project-sidebar-head{display:flex;align-items:center;justify-content:space-between;padding:0 7px 11px}.project-sidebar-head strong{font-size:13px}.project-sidebar-head span{color:var(--muted);font-size:11px}.project-list{display:grid;gap:3px}.project-item{display:block;width:100%;padding:11px 10px;border:0;border-radius:7px;text-align:left;background:transparent}.project-item:hover{background:#f1f8f8}.project-item.active{background:var(--brand-soft);box-shadow:inset 3px 0 var(--brand)}.project-item strong,.project-item span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-item strong{font-size:13px}.project-item span{margin-top:4px;color:var(--muted);font-size:11px}.project-main{min-width:0;padding:27px 32px 50px}.project-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:21px}.project-title{min-width:0}.back{border:0;padding:0;margin-bottom:9px;min-height:auto;color:var(--muted);background:transparent}.project-title h1{margin:0 0 7px;font-size:23px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.project-title p{margin:0;color:var(--muted);font-size:12px}.project-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.badge{height:23px;padding:0 8px;border-radius:4px;background:#f0f4f5;color:#5d6b71;font-size:11px;line-height:23px}.badge.brand{background:var(--brand-soft);color:var(--brand-strong)}.workspace-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);gap:18px;align-items:start}.panel{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 17px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:14px}.panel-head span{color:var(--muted);font-size:11px}.panel-body{padding:17px}.brief{min-height:116px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:11px;font-weight:700}.data-editor{min-height:180px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.55}.form-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.form-actions .left,.form-actions .right{display:flex;gap:7px;align-items:center}.hint{color:var(--muted);font-size:11px}.poster-panel{position:sticky;top:18px}.poster{width:min(100%,310px);margin:3px auto 0;aspect-ratio:9/16;border-radius:12px;padding:24px 20px 19px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative;background:#0a1223;color:#fff;box-shadow:0 14px 28px rgba(13,27,45,.18)}.poster:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(79,195,247,.24),transparent 37%),linear-gradient(160deg,transparent 52%,rgba(255,107,107,.12));pointer-events:none}.poster>*{position:relative}.poster.minimal{color:#10233d;background:#f7f9fc}.poster h3{margin:9px 0 0;white-space:pre-line;font-size:24px;line-height:1.12}.poster .poster-sub{margin:7px 0 0;color:#9eb2cc;font-size:11px}.poster.minimal .poster-sub{color:#60748e}.poster-kicker{font-size:10px;letter-spacing:.08em;color:#4fc3f7}.poster.minimal .poster-kicker{color:#1769aa}.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:7px;align-items:center;font-size:10px}.bar b{font-size:10px}.track{height:8px;border-radius:6px;overflow:hidden;background:rgba(157,180,204,.18)}.track i{display:block;height:100%;border-radius:6px;background:#ff6b6b}.poster.minimal .track i{background:#1769aa}.poster-footer{display:flex;justify-content:space-between;gap:8px;color:#9eb2cc;font-size:10px}.poster.minimal .poster-footer{color:#60748e}.preview-actions{display:flex;justify-content:center;gap:7px;margin-top:16px}.preview-actions button{min-height:32px}.job-list,.artifact-list{display:grid}.job-row,.artifact-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #edf1f2}.job-row:first-child,.artifact-row:first-child{border-top:0}.job-label{width:70px;flex:none;font-weight:700;font-size:12px}.job-info{min-width:0;flex:1}.job-info strong,.job-info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.job-info span{margin-top:2px;color:var(--muted);font-size:11px}.progress{height:4px;margin-top:6px;background:#edf1f2;border-radius:2px;overflow:hidden}.progress i{display:block;height:100%;background:var(--brand)}.percent{width:35px;text-align:right;color:var(--muted);font-size:11px}.state-completed{color:var(--success)}.state-failed{color:var(--danger)}.state-rendering,.state-preparing,.state-waiting_adapter,.state-queued{color:var(--orange)}.lower-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.feedback-list,.candidate-list{display:grid;gap:8px;margin-top:13px}.feedback-item,.candidate-item{padding:10px 11px;border:1px solid #edf1f2;border-radius:7px;background:#fbfcfc}.feedback-item header,.candidate-item header{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px}.feedback-item p{margin:6px 0 0;font-size:12px}.candidate-item p{margin:6px 0 0;color:var(--muted);font-size:11px}.candidate-type{color:var(--brand-strong);font-weight:700}.modal-wrap{position:fixed;inset:0;display:grid;place-items:center;background:rgba(16,31,38,.38);z-index:5}.modal{width:min(560px,calc(100vw - 40px));padding:22px;border-radius:11px;background:#fff;box-shadow:0 22px 60px rgba(16,31,38,.24)}.modal h2{margin:0 0 5px;font-size:18px}.modal p{margin:0 0 17px;color:var(--muted);font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}.ai-prompt{min-height:150px;background:#f7fafb}.notice{padding:10px 12px;border-radius:6px;background:#fff8ec;color:#86571a;font-size:12px}.notice.error{background:#fff0f0;color:#9d3131}.busy{pointer-events:none;opacity:.62}.hidden{display:none!important}@media(max-width:1220px){body{min-width:960px}.template-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace-grid{grid-template-columns:minmax(0,1fr) 330px}}@media(max-width:980px){body{min-width:0}.app{grid-template-rows:auto auto 1fr}.topbar{padding:12px 17px;flex-wrap:wrap;gap:10px}.brand{min-width:200px}.workspace{order:3;flex-basis:100%;max-width:none}.runtime{margin-left:auto}.nav{padding:0 12px;overflow:auto}.page{padding:24px 20px 40px}.hero{display:block}.hero-actions{margin-top:16px}.project-layout{display:block}.project-sidebar{border-right:0;border-bottom:1px solid var(--line);padding:12px}.project-list{display:flex;gap:4px;overflow:auto}.project-item{min-width:170px}.project-main{padding:22px 20px 40px}.workspace-grid{grid-template-columns:1fr}.poster-panel{position:static}.poster{width:270px}.lower-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">H</div><div><strong>短视频创作</strong><span>模板 · 对话 · 成片 · 沉淀</span></div></div>
      <div class="workspace"><input id="workspace" aria-label="短视频工作区" placeholder="选择短视频工作区"><button id="choose">选择目录</button><button id="load" class="primary">打开</button></div>
      <div class="runtime"><i id="runtimeDot" class="dot"></i><span id="runtimeText">运行时未检测</span></div>
    </header>
    <nav class="nav"><button data-view="home" class="active">工作台</button><button data-view="templates">模板库</button><button data-view="projects">项目</button><button data-view="candidates">沉淀资产</button></nav>
    <main id="content" class="content"></main>
  </div>
  <div id="modal" class="modal-wrap hidden"></div>
  <script>
    const invoke=window.__TAURI__?.core?.invoke||window.__TAURI_INTERNALS__?.invoke;
    const state={workspace:localStorage.getItem('himind-short-video-workspace')||'',projects:[],catalog:{templates:[],styles:[],adapters:[]},runtime:null,view:'home',selected:'',selectedWorkspace:'',detail:null,feedback:[],candidates:[],busy:false,polling:null,notice:''};
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const call=async(id,input={})=>{if(!invoke)throw new Error('当前窗口无法调用插件能力');return invoke('invoke_plugin_view_capability',{capabilityId:id,input});};
    const native=async(id,input={})=>{if(!invoke)throw new Error('当前窗口无法调用系统能力');return invoke(id,input);};
    const projectRoot=p=>p.workspace_root||state.workspace;
    const projectKey = project => projectRoot(project)+'|'+project.id;
    const date=value=>value?new Date(value).toLocaleString('zh-CN',{hour12:false}):'-';
    const size=value=>value>1048576?(value/1048576).toFixed(1)+' MB':Math.max(1,Math.round((value||0)/1024))+' KB';
    const statusLabel=value=>({queued:'排队中',preparing:'准备中',rendering:'构建中',waiting_adapter:'等待引擎',completed:'已完成',failed:'失败',cancelled:'已取消'}[value]||value||'-');
    const jsonPretty=value=>JSON.stringify(value||{},null,2);
    function setBusy(value){state.busy=value;document.body.classList.toggle('busy',value)}
    function setNotice(message,error=false){state.notice=message;const node=document.querySelector('[data-notice]');if(node){node.className='notice '+(error?'error':'');node.textContent=message;node.classList.toggle('hidden',!message)}}
    function handleError(error){setNotice(error?.message||String(error),true);window.scrollTo({top:0,behavior:'smooth'})}
    function render(){document.querySelectorAll('.nav button').forEach(node=>node.classList.toggle('active',node.dataset.view===state.view));if(state.view==='home')renderHome();else if(state.view==='templates')renderTemplates();else if(state.view==='projects')renderProjectsPage();else renderCandidatesPage()}
    async function loadWorkspace(selectFirst=true){const root=$('workspace').value.trim();if(!root)return;state.workspace=root;localStorage.setItem('himind-short-video-workspace',root);setBusy(true);try{const results=await Promise.all([call('short.video.project.list',{workspace_root:root}),call('short.video.catalog.list',{}),call('short.video.runtime.status',{workspace_root:root})]);state.projects=results[0].items||[];state.catalog=results[1]||state.catalog;state.runtime=results[2];renderRuntime();if(selectFirst&&state.projects.length&&!state.selected){await loadProject(state.projects[0])}else render()}catch(error){handleError(error)}finally{setBusy(false)}}
    function renderRuntime(){const renderer=(state.runtime?.renderers||[]).find(item=>item.id==='remotion')||{};const ready=renderer.state==='ready'||renderer.state==='available';$('runtimeDot').className='dot '+(ready?'ready':'');$('runtimeText').textContent=renderer.state==='ready'?'Remotion 已就绪':renderer.state==='available'?'Remotion 可用':'渲染运行时缺失'}
    function templateVisual(item){return item.id.includes('map')?'map':item.id.includes('photo')?'photo':item.id.includes('minimal')?'minimal':''}
    function renderTemplateCard(item){const styleNames=(item.compatible_styles||[]).map(id=>state.catalog.styles?.find(s=>s.id===id)?.name||id);return '<article class="template-card"><div class="template-visual '+templateVisual(item)+'"><small>'+esc(item.family)+' · '+esc(item.adapter)+'</small><strong>'+esc(item.name.split(' · ')[0])+'</strong><small>'+esc(item.composition)+' · '+esc(item.duration_seconds)+' 秒</small></div><h3>'+esc(item.name)+'</h3><p>'+esc(item.description)+'</p><div class="template-meta"><span class="tag accent">'+esc(item.adapter)+'</span>'+styleNames.slice(0,2).map(name=>'<span class="tag">'+esc(name)+'</span>').join('')+'</div><button class="primary" data-use-template="'+esc(item.id)+'">使用这个模板</button></article>'}
    function renderHome(){const recent=state.projects.slice(0,3);$('content').innerHTML=`<div class="page"><div data-notice class="notice hidden"></div><section class="hero"><div><div class="eyebrow">HIMIND SHORT VIDEO</div><h1>把一次创作，变成可复用的生产力</h1><p>从对话描述开始，选择成熟模板，替换数据并反复预览；满意后构建成片，把有效经验沉淀回模板资产。</p></div><div class="hero-actions"><button id="aiStart" class="ghost">✦ 对话创作</button><button id="newProject" class="primary">＋ 新建项目</button></div></section><div class="steps"><div class="step"><i>1</i><div><strong>说清目标</strong><span>对话 brief</span></div></div><div class="step"><i>2</i><div><strong>选一个模板</strong><span>实现方式可不同</span></div></div><div class="step"><i>3</i><div><strong>替换数据</strong><span>保留成熟节奏</span></div></div><div class="step"><i>4</i><div><strong>预览与反馈</strong><span>反复调教</span></div></div><div class="step"><i>5</i><div><strong>构建并沉淀</strong><span>形成新资产</span></div></div></div><div class="section-head"><div><h2>从模板开始</h2><p>模板只约定创作结果和插槽，底层可以由 Remotion、HyperFrames 或其他适配器实现。</p></div><button id="allTemplates" class="subtle">查看全部模板 →</button></div><div class="template-grid">${(state.catalog.templates||[]).slice(0,4).map(renderTemplateCard).join('')||'<div class="empty-line">打开一个工作区后，这里会显示可用模板。</div>'}</div><div class="section-head"><div><h2>最近项目</h2><p>从已有项目继续，或基于成熟项目快速二次创作。</p></div><button id="allProjects" class="subtle">查看全部项目 →</button></div><div class="project-strip">${recent.map(renderProjectCard).join('')||'<div class="empty-line">还没有项目。选择一个模板，开始第一条视频。</div>'}</div></div>`;bindHome()}
    function renderProjectCard(project){return '<button class="project-card" data-project-index="'+state.projects.indexOf(project)+'"><div class="project-icon">'+esc((project.name||'项').slice(0,1))+'</div><div><strong>'+esc(project.name)+'</strong><span>'+esc(project.template_id||project.template)+' · v'+esc(project.revision||1)+'</span><span>'+esc(date(project.updated_at))+'</span></div></button>'}
    function bindHome(){document.querySelectorAll('[data-use-template]').forEach(node=>node.addEventListener('click',()=>openCreate(node.dataset.useTemplate)));document.querySelectorAll('[data-project-index]').forEach(node=>node.addEventListener('click',()=>loadProject(state.projects[Number(node.dataset.projectIndex)])));$('allTemplates')?.addEventListener('click',()=>{state.view='templates';render()});$('allProjects')?.addEventListener('click',()=>{state.view='projects';render()});$('newProject')?.addEventListener('click',()=>openCreate());$('aiStart')?.addEventListener('click',()=>openAI())}
    function renderTemplates(){const families=[...new Set((state.catalog.templates||[]).map(item=>item.family))];$('content').innerHTML=`<div class="page"><div data-notice class="notice hidden"></div><section class="hero"><div><div class="eyebrow">模板资产库</div><h1>先选风格，再让数据进入节奏</h1><p>每个模板都有自己的实现方式，但对创作者暴露统一的项目、Recipe、预览和构建流程。</p></div><div class="hero-actions"><button id="templateAI" class="ghost">✦ 让 HiMind AI 推荐</button><button id="templateNew" class="primary">＋ 新建项目</button></div></section><div class="template-meta">${families.map(f=>'<span class="tag accent">'+esc(f)+'</span>').join('')}<span class="tag">${(state.catalog.templates||[]).length} 个模板</span><span class="tag">${(state.catalog.styles||[]).length} 个风格</span></div><div class="template-grid">${(state.catalog.templates||[]).map(renderTemplateCard).join('')||'<div class="empty-line">当前扩展源还没有模板资产。</div>'}</div></div>`;document.querySelectorAll('[data-use-template]').forEach(node=>node.addEventListener('click',()=>openCreate(node.dataset.useTemplate)));$('templateAI')?.addEventListener('click',()=>openAI());$('templateNew')?.addEventListener('click',()=>openCreate())}
    function renderProjectsPage(){const selected=state.detail;$('content').innerHTML='<div class="project-layout"><aside class="project-sidebar"><div class="project-sidebar-head"><strong>我的项目</strong><span>'+state.projects.length+'</span></div><div class="project-list">'+(state.projects.map((p,i)=>'<button class="project-item '+(projectKey(p)===(state.selectedWorkspace+'|'+state.selected)?'active':'')+'" data-project-index="'+i+'"><strong>'+esc(p.name)+'</strong><span>'+esc(p.template_id||p.template)+' · '+esc(date(p.updated_at))+'</span></button>').join('')||'<div class="empty-line">当前目录及子目录暂无项目</div>')+'</div></aside><section class="project-main">'+(selected?renderProjectWorkspace(selected):renderProjectEmpty())+'</section></div>';document.querySelectorAll('[data-project-index]').forEach(node=>node.addEventListener('click',()=>loadProject(state.projects[Number(node.dataset.projectIndex)])));bindProjectActions()}
    function renderProjectEmpty(){return '<div class="hero"><div><div class="eyebrow">项目工作区</div><h1>选择一个项目开始创作</h1><p>模板、数据、预览和沉淀都会围绕项目保存。</p></div><div class="hero-actions"><button id="emptyNew" class="primary">＋ 新建项目</button></div></div><div class="empty-line">还没有选中的项目。你可以从模板库创建一个项目，也可以在当前目录创建第一个项目。</div>'}
    function renderProjectWorkspace(result){const p=result.project||{},recipe=p.recipe||{},template=state.catalog.templates.find(item=>item.id===p.template_id)||{},style=state.catalog.styles.find(item=>item.id===p.style_id)||{};return '<div class="project-head"><div class="project-title"><button id="backHome" class="back">← 返回工作台</button><h1>'+esc(p.name)+'</h1><p>'+esc(p.description||'模板驱动的短视频项目')+' · 更新于 '+esc(date(p.updated_at))+'</p><div class="badges"><span class="badge brand">'+esc(template.name||p.template_id)+'</span><span class="badge">'+esc(style.name||p.style_id)+'</span><span class="badge">'+esc(recipe.adapter||template.adapter||'remotion')+'</span><span class="badge">v'+esc(p.revision||1)+'</span></div></div><div class="project-actions"><button id="projectAI" class="ghost">✦ HiMind AI</button><button id="duplicate">基于此项目二创</button><button id="preview" class="primary">生成预览</button><button id="render">构建视频</button></div></div><div data-notice class="notice hidden"></div><div class="workspace-grid"><section class="panel"><div class="panel-head"><h2>创作内容</h2><span>修改后保存为当前项目版本</span></div><div class="panel-body"><div class="field"><label>创作 brief</label><textarea id="brief" class="brief" placeholder="描述视频要表达什么、面向谁、节奏和必须遵守的风格规则。">'+esc(p.creative_brief||'')+'</textarea></div><div class="field-grid" style="margin-top:13px"><div class="field"><label>标题</label><input id="title" value="'+esc(recipe.title||'')+'"></div><div class="field"><label>副标题</label><input id="subtitle" value="'+esc(recipe.subtitle||'')+'"></div><div class="field"><label>统计周期</label><input id="period" value="'+esc(recipe.period||'')+'"></div><div class="field"><label>单位</label><input id="unit" value="'+esc(recipe.unit||'')+'"></div><div class="field full"><label>数据来源</label><input id="source" value="'+esc(recipe.source||'')+'"></div><div class="field full"><label>数据 JSON</label><textarea id="data" class="data-editor">'+esc(jsonPretty(recipe.data||{}))+'</textarea></div></div><div class="form-actions"><span class="hint">模板：'+esc(template.composition||'-')+' · '+esc(template.duration_seconds||'-')+' 秒 · 安全区规则已继承</span><div class="right"><button id="save" class="primary">保存当前版本</button></div></div></div></section><section class="panel poster-panel"><div class="panel-head"><h2>故事板预览</h2><span>先看结构，再构建成片</span></div><div class="panel-body"><div id="posterHost">'+renderPoster(recipe,style,template)+'</div><div class="preview-actions"><button id="previewSmall">生成 HTML 预览</button><button id="openLatest">打开最近预览</button></div></div></section></div><div class="lower-grid"><section class="panel"><div class="panel-head"><h2>任务与产物</h2><span>生成过程实时反馈</span></div><div class="panel-body">'+renderJobs(result.jobs||[]) + renderArtifacts(result.artifacts||[])+'</div></section><section class="panel"><div class="panel-head"><h2>反馈与沉淀</h2><span>把有效调整变成可复用资产</span></div><div class="panel-body">'+renderFeedbackForm()+'<div id="feedbackItems">'+renderFeedbackItems()+'</div><div id="candidateItems">'+renderCandidateItems()+'</div></div></section></div>'}
    function recipeItems(recipe){const data=recipe?.data||{};return Array.isArray(data.items)?data.items:[]}
    function renderPoster(recipe,style,template){const items=recipeItems(recipe).slice(0,5);const max=Math.max(1,...items.map(item=>Number(item.value)||0));const minimal=style.id==='minimal-white';return '<div class="poster '+(minimal?'minimal':'')+'"><div><div class="poster-kicker">'+esc(template.family||'SHORT VIDEO')+' · '+esc(template.composition||'STORYBOARD')+'</div><h3>'+esc(recipe.title||template.name||'未命名视频')+'</h3><p class="poster-sub">'+esc(recipe.subtitle||'先保存数据，再生成故事板预览')+'</p></div><div class="bars">'+(items.map((item,i)=>'<div class="bar"><b>'+(i+1)+'</b><div class="track"><i style="width:'+Math.max(8,Math.round((Number(item.value)||0)/max*100))+'%"></i></div><span>'+esc(item.name||'数据项')+'</span></div>').join('')||'<span class="hint">等待数据插槽</span>')+'</div><div class="poster-footer"><span>'+esc(recipe.period||'未设置周期')+'</span><span>'+esc(recipe.unit||'')+'</span></div></div>'}
    function renderJobs(jobs){if(!jobs.length)return '<div class="notice">还没有任务。生成预览后，任务进度会显示在这里。</div>';return '<div class="job-list">'+jobs.slice(0,6).map(job=>'<div class="job-row"><strong class="job-label state-'+esc(job.status)+'">'+esc(job.stage==='preview'?'预览':'构建')+'</strong><div class="job-info"><strong>'+esc(statusLabel(job.status))+'</strong><span>'+esc(job.message||'-')+' · '+esc(date(job.updated_at))+'</span><div class="progress"><i style="width:'+Math.max(0,Math.min(100,job.progress||0))+'%"></i></div></div><span class="percent">'+esc(job.progress||0)+'%</span></div>').join('')+'</div>'}
    function renderArtifacts(artifacts){if(!artifacts.length)return '';return '<div class="artifact-list" style="margin-top:12px">'+artifacts.slice(0,5).map(item=>'<div class="artifact-row"><div class="job-info"><strong>'+esc(item.kind==='video/mp4'?'视频成片':'HTML 故事板')+'</strong><span>'+esc(size(item.size))+' · '+esc(date(item.created_at))+'</span></div><button data-open-artifact="'+esc(item.artifact_id)+'" data-mode="file">打开</button><button data-open-artifact="'+esc(item.artifact_id)+'" data-mode="folder">目录</button></div>').join('')+'</div>'}
    function renderFeedbackForm(){return '<div class="field-grid"><div class="field"><label>反馈类型</label><select id="feedbackCategory"><option value="style">风格</option><option value="layout">布局</option><option value="motion">动效</option><option value="data">数据</option><option value="narrative">叙事</option><option value="quality">质量</option></select></div><div class="field"><label>沉淀意愿</label><select id="feedbackAccepted"><option value="true">保留为规则</option><option value="false">仅作本次记录</option></select></div><div class="field full"><label>预览反馈</label><textarea id="feedbackText" placeholder="例如：前三名层级很好，但副标题需要更克制。"></textarea></div></div><div class="form-actions"><span class="hint">接受的反馈可以作为模板变体、风格包或质量规则候选。</span><button id="recordFeedback" class="ghost">记录反馈</button></div>'}
    function renderFeedbackItems(){if(!state.feedback.length)return '<div class="empty-line" style="margin-top:13px">还没有反馈记录。</div>';return '<div class="feedback-list">'+state.feedback.slice(-4).reverse().map(item=>'<div class="feedback-item"><header><span>'+esc(item.category)+' · '+(item.accepted?'已接受':'已记录')+'</span><span>'+esc(date(item.created_at))+'</span></header><p>'+esc(item.feedback)+'</p></div>').join('')+'</div>'}
    function renderCandidateItems(){if(!state.candidates.length)return '<div class="empty-line" style="margin-top:13px">完成一次预览反馈后，候选资产会出现在这里。</div>';return '<div class="candidate-list"><div class="section-head" style="margin:17px 0 0"><div><h2 style="font-size:13px">最近候选</h2></div></div>'+state.candidates.slice(0,4).map(item=>'<div class="candidate-item"><header><span class="candidate-type">'+esc(item.candidate_type)+'</span><span>'+esc(date(item.created_at))+'</span></header><p>'+esc(Object.keys(item.changes||{}).join('、'))+'</p></div>').join('')+'</div>'}
    function bindProjectActions(){if($('emptyNew'))$('emptyNew').addEventListener('click',()=>openCreate());$('backHome')?.addEventListener('click',()=>{state.view='home';render()});$('projectAI')?.addEventListener('click',()=>openAI());$('duplicate')?.addEventListener('click',()=>openDuplicate());$('preview')?.addEventListener('click',()=>saveAndRun('short.video.preview.start'));$('previewSmall')?.addEventListener('click',()=>saveAndRun('short.video.preview.start'));$('render')?.addEventListener('click',()=>saveAndRun('short.video.render.start'));$('save')?.addEventListener('click',()=>saveRecipe(false));$('openLatest')?.addEventListener('click',()=>openLatestPreview());$('recordFeedback')?.addEventListener('click',recordFeedback);document.querySelectorAll('[data-open-artifact]').forEach(node=>node.addEventListener('click',()=>openArtifact(node.dataset.openArtifact,node.dataset.mode)));schedulePoll(state.detail?.jobs||[])}
    async function loadProject(project){const item=typeof project==='string'?state.projects.find(p=>p.id===project):project;const id=item?.id||project;const root=item?.workspace_root||state.selectedWorkspace||state.workspace;if(!id)return;state.selected=id;state.selectedWorkspace=root;setBusy(true);try{const result=await call('short.video.project.get',{workspace_root:root,project_id:id});const extras=await Promise.all([call('short.video.feedback.list',{workspace_root:root,project_id:id}),call('short.video.candidate.list',{workspace_root:root,project_id:id})]);state.detail=result;state.feedback=extras[0].items||[];state.candidates=extras[1].items||[];state.view='projects';render()}catch(error){handleError(error)}finally{setBusy(false)}}
    function schedulePoll(jobs){clearInterval(state.polling);if((jobs||[]).some(job=>['queued','preparing','rendering','running','waiting_adapter'].includes(job.status)))state.polling=setInterval(()=>loadProject({id:state.selected,workspace_root:state.selectedWorkspace}),1800)}
    function readRecipeFromForm(){const recipe=JSON.parse(JSON.stringify(state.detail.project.recipe||{}));recipe.title=$('title').value;recipe.subtitle=$('subtitle').value;recipe.period=$('period').value;recipe.unit=$('unit').value;recipe.source=$('source').value;let data;try{data=JSON.parse($('data').value||'{}')}catch(error){throw new Error('数据 JSON 格式不正确，请先修复')};recipe.data=data;return recipe}
    async function saveRecipe(run){if(!state.detail)return;setBusy(true);try{const recipe=readRecipeFromForm();const result=await call('short.video.project.update',{workspace_root:state.selectedWorkspace,project_id:state.selected,name:state.detail.project.name,creative_brief:$('brief').value,expected_updated_at:state.detail.project.updated_at,recipe});if(result.state==='blocked')throw new Error((result.blockers||[]).map(item=>item.message).join('；')||'项目已更新，请刷新后重试');if(run){await runCapability(run)}else{await loadProject({id:state.selected,workspace_root:state.selectedWorkspace});setNotice('当前版本已保存')}}catch(error){handleError(error)}finally{setBusy(false)}}
    async function saveAndRun(capability){await saveRecipe(capability)}
    async function runCapability(capability){const result=await call(capability,{workspace_root:state.selectedWorkspace,project_id:state.selected});if(result.state==='blocked')throw new Error((result.blockers||[]).map(item=>item.message).join('；')||'操作受阻');await loadProject({id:state.selected,workspace_root:state.selectedWorkspace})}
    async function recordFeedback(){const text=$('feedbackText')?.value.trim();if(!text)return;setBusy(true);try{await call('short.video.feedback.record',{workspace_root:state.selectedWorkspace,project_id:state.selected,category:$('feedbackCategory').value,feedback:text,accepted:$('feedbackAccepted').value==='true'});await loadProject({id:state.selected,workspace_root:state.selectedWorkspace});setNotice('反馈已记录，可以继续调整后再次预览')}catch(error){handleError(error)}finally{setBusy(false)}}
    async function openArtifact(id,mode){try{await call('short.video.artifact.open',{workspace_root:state.selectedWorkspace,artifact_id:id,mode})}catch(error){handleError(error)}}
    async function openLatestPreview(){const artifact=state.detail?.latest_preview||state.detail?.artifacts?.find(item=>item.kind==='preview/html');if(artifact)await openArtifact(artifact.artifact_id,'file');else setNotice('还没有可打开的预览，请先生成预览')}
    function openCreate(templateID){const selected=templateID||state.catalog.templates[0]?.id||'';$('modal').innerHTML='<div class="modal"><h2>新建短视频项目</h2><p>选择一个模板作为创作起点。模板实现方式不同，但项目数据、预览和沉淀流程保持一致。</p><div class="field-grid"><div class="field full"><label>项目名称</label><input id="modalName" placeholder="例如：2026 文旅榜单"></div><div class="field"><label>模板</label><select id="modalTemplate">'+(state.catalog.templates||[]).map(item=>'<option value="'+esc(item.id)+'" '+(item.id===selected?'selected':'')+'>'+esc(item.name)+'</option>').join('')+'</select></div><div class="field"><label>风格</label><select id="modalStyle">'+(state.catalog.styles||[]).map(item=>'<option value="'+esc(item.id)+'">'+esc(item.name)+'</option>').join('')+'</select></div><div class="field full"><label>创作 brief</label><textarea id="modalBrief" class="ai-prompt" placeholder="告诉 AI 这条视频要表达什么，哪些风格规则不能变。"></textarea></div></div><div class="modal-actions"><button id="modalCancel">取消</button><button id="modalCreate" class="primary">创建并进入工作区</button></div></div>'; $('modal').classList.remove('hidden');$('modalCancel').addEventListener('click',closeModal);$('modalCreate').addEventListener('click',createProject)}
    function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
    async function createProject(){const name=$('modalName').value.trim();if(!name)return;setBusy(true);try{const result=await call('short.video.project.create',{workspace_root:state.workspace,name,template_id:$('modalTemplate').value,style_id:$('modalStyle').value,creative_brief:$('modalBrief').value});closeModal();await loadWorkspace(false);await loadProject({id:result.project.id,workspace_root:result.workspace_root})}catch(error){handleError(error)}finally{setBusy(false)}}
    function openDuplicate(){const p=state.detail?.project;if(!p)return;$('modal').innerHTML='<div class="modal"><h2>基于此项目二创</h2><p>继承当前模板、风格、Recipe 和创作 brief，只替换这一次视频需要变化的内容。</p><div class="field-grid"><div class="field full"><label>新项目名称</label><input id="modalName" value="'+esc(p.name+' · 新版本')+'"></div><div class="field"><label>模板</label><select id="modalTemplate"><option value="">沿用 '+esc(p.template_id)+'</option>'+(state.catalog.templates||[]).map(item=>'<option value="'+esc(item.id)+'">'+esc(item.name)+'</option>').join('')+'</select></div><div class="field"><label>风格</label><select id="modalStyle"><option value="">沿用 '+esc(p.style_id)+'</option>'+(state.catalog.styles||[]).map(item=>'<option value="'+esc(item.id)+'">'+esc(item.name)+'</option>').join('')+'</select></div><div class="field full"><label>本次创作 brief（可选）</label><textarea id="modalBrief" class="ai-prompt" placeholder="例如：换成 2026 年数据，节奏保持不变。"></textarea></div></div><div class="modal-actions"><button id="modalCancel">取消</button><button id="modalCreate" class="primary">创建二创项目</button></div></div>';$('modal').classList.remove('hidden');$('modalCancel').addEventListener('click',closeModal);$('modalCreate').addEventListener('click',duplicateProject)}
    async function duplicateProject(){const name=$('modalName').value.trim();if(!name)return;setBusy(true);try{const result=await call('short.video.project.duplicate',{workspace_root:state.workspace,source_workspace_root:state.selectedWorkspace,source_project_id:state.selected,name,template_id:$('modalTemplate').value,style_id:$('modalStyle').value,creative_brief:$('modalBrief').value});closeModal();await loadWorkspace(false);await loadProject({id:result.project.id,workspace_root:result.workspace_root})}catch(error){handleError(error)}finally{setBusy(false)}}
    async function openAI(){const brief=state.detail?.project?.creative_brief||'请根据短视频模板库，先推荐一个适合当前目标的模板，再明确数据字段、节奏、画面层级和预览验收标准。';try{await navigator.clipboard?.writeText(brief);const url=await native('start_builtin_ai_session',{});if(url)window.open(url,'_blank');setNotice('创作 brief 已复制，HiMind AI 会话已打开。')}catch(error){handleError(error)}}
    function renderCandidatesPage(){const items=state.candidates.length?state.candidates:[];$('content').innerHTML='<div class="page"><div data-notice class="notice hidden"></div><section class="hero"><div><div class="eyebrow">可复用资产</div><h1>把反复调教过的结果留下来</h1><p>模板变体、风格包和质量规则都会带着来源项目与反馈证据，便于后续复核和扩展源沉淀。</p></div><div class="hero-actions"><button id="candidateProjects" class="primary">回到项目</button></div></section><div class="panel"><div class="panel-head"><h2>候选资产</h2><span>当前工作区 · '+esc(state.workspace||'未选择')+'</span></div><div class="panel-body">'+(items.map(item=>'<div class="candidate-item"><header><span class="candidate-type">'+esc(item.candidate_type)+'</span><span>'+esc(date(item.created_at))+'</span></header><p>项目 '+esc(item.project_id)+' · '+esc(Object.keys(item.changes||{}).join('、'))+'</p><p>'+esc((item.evidence||[]).join('；'))+'</p></div>').join('')||'<div class="empty-line">完成项目预览和反馈后，候选资产会在这里集中显示。</div>')+'</div></div></div>';$('candidateProjects')?.addEventListener('click',()=>{state.view='projects';render()})}
    $('choose').addEventListener('click',async()=>{try{const result=await native('pick_short_video_workspace');if(result?.path){$('workspace').value=result.path;await loadWorkspace(false)}}catch(error){handleError(error)}});$('load').addEventListener('click',()=>loadWorkspace());$('workspace').addEventListener('keydown',event=>{if(event.key==='Enter')loadWorkspace()});document.querySelectorAll('.nav button').forEach(node=>node.addEventListener('click',()=>{state.view=node.dataset.view;render()}));
    async function bootstrap(){$('workspace').value=state.workspace;if(state.workspace){await loadWorkspace(false);return}try{const context=await native('get_plugin_view_context');const bound=String(context?.workspace_root||'').trim();if(bound){$('workspace').value=bound;await loadWorkspace(false);return}}catch(_error){}render()}
    bootstrap();
  </script>
</body>
</html>
