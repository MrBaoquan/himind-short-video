  <style>

    *{box-sizing:border-box}body{margin:0;min-width:1080px;background:var(--bg);color:var(--ink);font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);min-height:36px;padding:0 13px;cursor:pointer}button:hover{border-color:#a8c3c6;background:#f6fbfb}button.primary{border-color:var(--brand);background:var(--brand);color:#fff}button.primary:hover{background:var(--brand-strong)}button.subtle{border-color:transparent;background:transparent;color:var(--muted)}button.ghost{background:var(--brand-soft);border-color:transparent;color:var(--brand-strong)}button.danger{color:var(--danger)}button:disabled{opacity:.46;cursor:not-allowed}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);outline:0;padding:9px 10px}input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,125,133,.1)}textarea{resize:vertical;min-height:90px}.app{min-height:100vh;display:grid;grid-template-rows:64px 48px 1fr}.topbar{display:flex;align-items:center;gap:20px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;min-width:245px}.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;font-weight:800}.brand strong{display:block;font-size:15px}.brand span{display:block;margin-top:1px;color:var(--muted);font-size:11px}.workspace{display:flex;align-items:center;gap:8px;flex:1;max-width:720px}.workspace input{height:34px;min-width:0}.workspace button{min-height:34px;padding:0 12px}.runtime{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#a9b4b8}.dot.ready{background:var(--success)}.nav{display:flex;align-items:center;gap:4px;padding:0 2 -size:14px}.panel-head span{color:var(--muted);font-size:11px}.panel-body{padding:17px}.brief{min-height:116px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:11px;font-weight:700}.data-editor{min-height:180px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.55}.form-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.form-actions .left,.form-actions .right{display:flex;gap:7px;align-items:center}.hint{color:var(--muted);font-size:11px}.poster-panel{position:sticky;top:18px}.poster{width:min(100%,310px);margin:3px auto 0;aspect-ratio:9/16;border-radius:12px;padding:24px 20px 19px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative;background:#0a1223;color:#fff;box-shadow:0 14px 28px rgba(13,27,45,.18)}.poster:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(79,195,247,.24),transparent 37%),linear-gradient(160deg,transparent 52%,rgba(255,107,107,.12));pointer-events:none}.poster>*{position:relative}.poster.minimal{color:#10233d;background:#f7f9fc}.poster h3{margin:9px 0 0;white-space:pre-line;font-size:24px;line-height:1.12}.poster .poster-sub{margin:7px 0 0;color:#9eb2cc;font-size:11px}.poster.minimal .poster-sub{color:#60748e}.poster-kicker{font-size:10px;letter-spacing:.08em;color:#4fc3f7}.poster.minimal .poster-kicker{color:#1769aa}.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:7px;align-items:center;font-size:10px}.bar b{font-size:10px}.track{height:8px;border-radius:6px;overflow:hidden;background:rgba(157,180,204,.18)}.track i{display:block;height:100%;border-radius:6px;background:#ff6b6b}.poster.minimal .track i{background:#1769aa}.poster-footer{display:flex;justify-content:space-between;gap:8px;color:#9eb2cc;font-size:10px}.poster.minimal .poster-footer{color:#60748e}.preview-actions{display:flex;justify-content:center;gap:7px;margin-top:16px}.preview-actions button{min-height:32px}.job-list,.artifact-list{display:grid}.job-row,.artifact-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #edf1f2}.job-row:first-child,.artifact-row:first-child{border-top:0}.job-label{width:70px;flex:none;font-weight:700;font-size:12px}.job-info{min-width:0;flex:1}.job-info strong,.job-info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.job-info span{margin-top:2px;color:var(--muted);font-size:11px}.progress{height:4px;margin-top:6px;background:#edf1f2;border-radius:2px;overflow:hidden}.progress i{display:block;height:100%;background:var(--brand)}.percent{width:35px;text-align:right;color:var(--muted);font-size:11px}.state-completed{color:var(--success)}.state-failed{color:var(--danger)}.state-rendering,.state-preparing,.state-waiting_adapter,.state-queued{color:var(--orange)}.candidate-item{padding:10px 11px;border:1px solid #edf1f2;border-radius:7px;background:#fbfcfc}.candidate-item header{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px}.candidate-item p{margin:6px 0 0;color:var(--muted);font-size:11px}.candidate-type{color:var(--brand-strong);font-weight:700}.modal-wrap{position:fixed;inset:0;display:grid;place-items:center;background:rgba(16,31,38,.38);z-index:5}.modal{width:min(560px,calc(100vw - 40px));padding:22px;border-radius:11px;background:#fff;box-shadow:0 22px 60px rgba(16,31,38,.24)}.modal h2{margin:0 0 5px;font-size:18px}.modal p{margin:0 0 17px;color:var(--muted);font-size:12px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}.ai-prompt{min-height:150px;background:#f7fafb}.notice{padding:10px 12px;border-radius:6px;background:#fff8ec;color:#86571a;font-size:12px}.notice.error{background:#fff0f0;color:#9d3131}.busy{pointer-events:none;opacity:.62}.hidden{display:none! <body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">H</div><div><strong>短视频创作</strong><span>项目 · 模板 · 成片</span></div></div>
      <div class="workspace"><span id="workspaceLabel" class="workspace-path" title="当前短视频工作区">未选择工作区</span><button id="choose" class="ghost">切换</button></div>
      <button id="newProject" class="primary top-new">＋ 新建项目</button>
      <div class="runtime"><i id="runtimeDot" class="dot"></i><span id="runtimeText">运行时未检测</span></div>
    </header>
    <nav class="nav"><button data-view="projects" class="active">项目</button><button data-view="templates">模板库</button></nav>
    <main id="content" class="content"></main>
  </div>
  <div id="modal" class="modal-wrap hidden"></div>
  <script>
    const invoke=window.__TAURI__?.core?.invoke||window.__TAURI_INTERNALS__?.invoke;
    const state={workspace:'',workspaceSource:'',workspaceBound:false,projects:[],catalog:{templates:[],styles:[],adapters:[]},runtime:null,view:'projects',selected:'',selectedWorkspace:'',detail:null,feedback:[],candidates:[],busy:false,polling:null,notice:''};
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const call=async(id,input={})=>{if(!invoke)throw new Error('当前窗口无法调用插件能力');return invoke('invoke_plugin_view_capability',{capabilityId:id,input});};
    const native=async(id,input={})=>{if(!invoke)throw new Error('当前窗口无法调用系统能力');return invoke(id,input);};
    const projectRoot=p=>p.workspace_root||state.workspace;
    const projectKey = project => projectRoot(project)+'|'+project.id;
    const date=value=>value?new Date(value).toLocaleString('zh-CN',{hour12:false}):'-';
    const size=value=>value>1048576?(value/1048576).toFixed(1)+' MB':Math.max(1,Math.round((value||0)/1024))+' KB';
    const statusLabel=value=>({queued:'排队中',preparing:'准备中',rendering:'构建中',waiting_adapter:'等待引擎',completed:'已完成',failed:'失败',cancelled:'已取消'}[value]||value||'-');
    const jsonPretty=value=>JSON.stringify(value||{},null,2);
    function setBusy(value){state.busy=value;document.body.classList.toggle('busy',value)}
    function setNotice(message,error=false){state.notice=message;const node=document.querySelector('[data-notice]');if(node){node.className='notice '+(error?'error':'');node.textContent=message;node.classList.toggle('hidden',!message)}}
    function handleError(error){setNotice(error?.message||String(error),true);window.scrollTo({top:0,behavior:'smooth'})}
    function render(){document.querySelectorAll('.nav button').forEach(node=>node.classList.toggle('active',node.dataset.view===state.view));if(state.view==='templates')renderTemplates();else if(state.view==='candidates')renderCandidatesPage();else renderProjectsPage()}
    async function loadWorkspace(selectFirst=true){const root=state.workspace.trim();if(!root)return;const changed=root!==state.workspace;state.workspace=root;localStorage.setItem('himind-short-video-workspace',root);const label=$('workspaceLabel');if(label){label.textContent=root;label.title=root}if(changed){state.selected='';state.selectedWorkspace='';state.detail=null;state.feedback=[];state.candidates=[]}setBusy(true);try{const results=await Promise.all([call('short.video.project.list',{workspace_root:root}),call('short.video.catalog.list',{}),call('short.video.runtime.status',{workspace_root:root})]);state.projects=results[0].items||[];state.catalog=results[1]||state.catalog;state.runtime=results[2];renderRuntime();if(selectFirst&&state.projects.length&&!state.selected){await loadProject(state.projects[0])}else render()}catch(error){handleError(error)}finally{setBusy(false)}}
    function renderRuntime(){const renderer=(state.runtime?.renderers||[]).find(item=>item.id==='remotion')||{};const ready=renderer.state==='ready'||renderer.state==='available';$('runtimeDot').className='dot '+(ready?'ready':'');$('runtimeText').textContent=renderer.state==='ready'?'Remotion 已就绪':renderer.state==='available'?'Remotion 可用':'渲染运行时缺失'}
    function svgThumb(item){const seed=[...String(item.id||'')].reduce((a,c)=>a+c.charCodeAt(0),0)||7;const palette=[['#0d1928','#1b4860','#9be1ea','#ffd28a'],['#f4f9fd','#d9e8ef','#1769aa','#7aa7c9'],['#123f5a','#098789','#c8f0ec','#ffd28a'],['#4a4568','#b06462','#e8d3d0','#f7e2b8']];const p=palette[seed%palette.length];const light=seed%2===0;const bars=[55,78,64,92,70,100];const n=4;const lines=[...Array(n)].map((_,i)=>'<rect x="34" y="'+(156+i*34)+'" width="'+Math.round(bars[(seed+i)%bars.length]*1.15)+'" height="16" rx="6" fill="'+(light?'#4fc3f7':'#ff6b6b')+'" opacity=".92"/>').join('');const ink=light?'#174060':'#fff';const soft=light?'#60748e':'#9eb2cc';return '<svg viewBox="0 0 200 356" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="tg'+(seed%97)+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+p[0]+'"/><stop offset="1" stop-color="'+p[1]+'"/></linearGradient></defs><rect width="200" height="356" fill="url(#tg'+(seed%97)+')"/><text x="20" y="32" font-size="9" letter-spacing="2" fill="'+p[2]+'">'+esc(String(item.family||'SHORT VIDEO').toUpperCase())+'</text><text x="20" y="66" font-size="16" font-weight="700" fill="'+ink+'">'+esc((item.name||'模板').split(' · ')[0])+'</text><text x="20" y="88" font-size="9" fill="'+soft+'">'+esc(item.composition||'STORYBOARD')+' · '+esc(item.adapter||'remotion')+'</text>'+lines+'<text x="20" y="328" font-size="9" fill="'+soft+'">'+esc(item.duration_seconds||'-')+' 秒 · 9:16</text></svg>'}
    function renderTemplateCard(item){const styleNames=(item.compatible_styles||[]).map(id=>state.catalog.styles?.find(s=>s.id===id)?.name||id);return '<article class="template-card"><div class="template-visual">'+svgThumb(item)+'</div><h3>'+esc(item.name)+'</h3><p>'+esc(item.description)+'</p><div class="template-meta"><span class="tag accent">'+esc(item.adapter)+'</span>'+styleNames.slice(0,2).map(name=>'<span class="tag">'+esc(name)+'</span>').join('')+'</div><button class="primary" data-use-template="'+esc(item.id)+'">使用这个模板</button></article>'}
    function renderTemplates(){const families=[...new Set((state.catalog.templates||[]).map(item=>item.family))];$('content').innerHTML=`<div class="page"><div data-notice class="notice hidden"></div><section class="hero compact"><div><div class="eyebrow">模板资产库</div><h1>模板</h1><p>模板约定画面、插槽和时长，对创作者暴露统一的填数据、预览与构建流程。</p></div></section><div class="template-meta">${families.map(f=>'<span class="tag accent">'+esc(f)+'</span>').join('')}<span class="tag">${(state.catalog.templates||[]).length} 个模板</span><span class="tag">${(state.catalog.styles||[]).length} 个风格</span></div><div class="template-grid">${(state.catalog.templates||[]).map(renderTemplateCard).join('')||'<div class="empty-line">打开工作区后，模板资产会显示在这里。</div>'}</div><div class="asset-entry"><span>把反复调教过的结果沉淀为可复用资产</span><button id="viewCandidates" class="subtle">查看沉淀资产 →</button></div></div>`;document.querySelectorAll('[data-use-template]').forEach(node=>node.addEventListener('click',()=>openCreate(node.dataset.useTemplate)));$('viewCandidates')?.addEventListener('click',()=>{state.view='candidates';render()})}
    function renderProjectsPage(){const selected=state.detail;$('content').innerHTML='<div class="project-layout"><aside class="project-sidebar"><div class="project-sidebar-head"><strong>我的项目</strong><span>'+state.projects.length+'</span></div><div class="project-list">'+(state.projects.map((p,i)=>'<button class="project-item '+(projectKey(p)===(state.selectedWorkspace+'|'+state.selected)?'active':'')+'" data-project-index="'+i+'"><strong>'+esc(p.name)+'</strong><span>'+esc(p.template_id||p.template)+' · '+esc(date(p.updated_at))+'</span></button>').join('')||'<div class="empty-line">当前目录及子目录暂无项目</div>')+'</div></aside><section class="project-main">'+(selected?renderProjectWorkspace(selected):renderProjectEmpty())+'</section></div>';document.querySelectorAll('[data-project-index]').forEach(node=>node.addEventListener('click',()=>loadProject(state.projects[Number(node.dataset.projectIndex)])));bindProjectActions()}
    function renderProjectEmpty(){return '<div class="hero"><div><div class="eyebrow">项目工作区</div><h1>选择左侧项目开始创作</h1><p>模板、数据、预览和沉淀都会围绕项目保存。</p></div><div class="hero-actions"><button id="emptyNew" class="primary">＋ 新建项目</button></div></div><div class="empty-line">还没有选中的项目。你可以从模板库创建一个项目，也可以在当前目录创建第一个项目。</div>'}
    function renderProjectWorkspace(result){const p=result.project||{},recipe=p.recipe||{},template=state.catalog.templates.find(item=>item.id===p.template_id)||{},style=state.catalog.styles.find(item=>item.id===p.style_id)||{},items=recipeItems(recipe);return `<div class="project-head"><div class="project-title"><h1>${esc(p.name)}</h1><p>${esc(p.description||'模板驱动的短视频项目')} · 更新于 ${esc(date(p.updated_at))}</p><div class="badges"><span class="badge brand">${esc(template.name||p.template_id)}</span><span class="badge">${esc(style.name||p.style_id)}</span><span class="badge">${esc(recipe.adapter||template.adapter||'remotion')}</span><span class="badge">v${esc(p.revision||1)}</span></div></div><div class="project-actions"><button id="duplicate" class="ghost">二创</button><button id="projectAI" class="ghost">✦ HiMind AI</button></div></div><div data-notice class="notice hidden"></div><div class="workspace-grid"><section class="panel"><div class="panel-head"><h2>创作内容</h2><span>改动后保存生效</span></div><div class="panel-body"><div class="field-grid"><div class="field"><label>标题</label><input id="title" value="${esc(recipe.title||'')}" placeholder="视频主标题"></div><div class="field"><label>副标题</label><input id="subtitle" value="${esc(recipe.subtitle||'')}" placeholder="一句话说明"></div></div><div class="field" style="margin-top:13px"><label>数据项</label><div class="items-editor" id="itemsEditor">${items.length?items.map((item,i)=>renderItemRow(item,i)).join(''):renderItemRow({name:'',value:'',unit:''},0)}</div><button id="addItem" class="items-add">＋ 添加数据项</button></div><details class="advanced-json"><summary>更多设置（周期 / 单位 / 来源 / brief / 高级 JSON）</summary><div class="field-grid" style="margin-top:11px"><div class="field"><label>统计周期</label><input id="period" value="${esc(recipe.period||'')}"></div><div class="field"><label>单位</label><input id="unit" value="${esc(recipe.unit||'')}"></div><div class="field full"><label>数据来源</label><input id="source" value="${esc(recipe.source||'')}"></div><div class="field full"><label>创作 brief</label><textarea id="brief" class="brief" placeholder="描述视频要表达什么、面向谁、节奏和必须遵守的风格规则。">${esc(p.creative_brief||'')}</textarea></div></div><textarea id="data" class="data-editor" style="margin-top:11px">${esc(jsonPretty(recipe.data||{}))}</textarea></details><div class="form-actions"><span class="hint">模板：${esc(template.composition||'-')} · ${esc(template.duration_seconds||'-')} 秒</span><div class="right"><button id="save" class="primary">保存</button></div></div></div></section><section class="panel poster-panel"><div class="panel-head"><h2>预览与成片</h2><span>实时动效 · 一键构建</span></div><div class="panel-body"><div class="preview-actions"><button id="preview" class="primary">▶ 播放动效预览</button><button id="render" class="ghost">构建视频</button></div><div id="previewHost" class="preview-host">${renderPoster(recipe,style,template)}</div>${renderTaskBar(result.jobs||[])}${renderArtifacts(result.artifacts||[])}</div></section></div>`}
    function recipeItems(recipe){const data=recipe?.data||{};return Array.isArray(data.items)?data.items:[]}
    function renderPoster(recipe,style,template){const items=recipeItems(recipe).slice(0,5);const max=Math.max(1,...items.map(item=>Number(item.value)||0));const minimal=style.id==='minimal-white';return '<div class="poster '+(minimal?'minimal':'')+'"><div><div class="poster-kicker">'+esc(template.family||'SHORT VIDEO')+' · '+esc(template.composition||'STORYBOARD')+'</div><h3>'+esc(recipe.title||template.name||'未命名视频')+'</h3><p class="poster-sub">'+esc(recipe.subtitle||'先保存数据，再生成故事板预览')+'</p></div><div class="bars">'+(items.map((item,i)=>'<div class="bar"><b>'+(i+1)+'</b><div class="track"><i style="width:'+Math.max(8,Math.round((Number(item.value)||0)/max*100))+'%"></i></div><span>'+esc(item.name||'数据项')+'</span></div>').join('')||'<span class="hint">等待数据插槽</span>')+'</div><div class="poster-footer"><span>'+esc(recipe.period||'未设置周期')+'</span><span>'+esc(recipe.unit||'')+'</span></div></div>'}
    function renderTaskBar(jobs){if(!jobs.length)return '<div class="task-bar empty">生成预览或构建视频后，进度会显示在这里。</div>';const active=jobs.find(job=>['queued','preparing','rendering','waiting_adapter'].includes(job.status))||jobs[0];return '<div class="task-bar"><div class="task-row"><strong class="job-label state-'+esc(active.status)+'">'+esc(active.stage==='preview'?'预览':'构建')+'</strong><div class="job-info"><strong>'+esc(statusLabel(active.status))+'</strong><span>'+esc(active.message||'-')+'</span><div class="progress"><i style="width:'+Math.max(0,Math.min(100,active.progress||0))+'%"></i></div></div><span class="percent">'+esc(active.progress||0)+'%</span></div></div>'}
    function renderArtifacts(artifacts){if(!artifacts.length)return '';return '<div class="artifact-strip"><div class="strip-head">最近产物</div>'+artifacts.slice(0,4).map(item=>{const isVideo=item.kind==='video/mp4',isHtml=item.kind==='preview/html',isPlayer=item.kind==='preview/player';const play=isVideo?'<button data-play-artifact="'+esc(item.artifact_id)+'">播放</button>':(isPlayer||isHtml?'<button data-embed-artifact="'+esc(item.artifact_id)+'">预览</button>':'');return '<div class="artifact-row"><div class="job-info"><strong>'+esc(isVideo?'视频成片':isPlayer?'动效预览':isHtml?'静态预览':'产物')+'</strong><span>'+esc(size(item.size))+' · '+esc(date(item.created_at))+'</span></div>'+play+'<button data-open-artifact="'+esc(item.artifact_id)+'" data-mode="file">打开</button><div class="artifact-player hidden" data-artifact-host="'+esc(item.artifact_id)+'"></div></div>'}).join('')+'</div>'}
    function renderItemRow(item,i){return `<div class="items-row"><input data-item-name="${i}" value="${esc(item.name??'')}" placeholder="名称，如 项目 A"><input data-item-value="${i}" type="number" step="any" min="0" value="${esc(item.value??'')}" placeholder="数值"><input data-item-unit="${i}" value="${esc(item.unit??'')}" placeholder="单位，可留空"><button class="item-remove" data-item-remove title="删除">✕</button></div>`}
    function collectItems(){return [...document.querySelectorAll('#itemsEditor .items-row')].map(row=>{const inputs=row.querySelectorAll('input');const name=(inputs[0]?.value||'').trim();const value=(inputs[1]?.value||'').trim();const unit=(inputs[2]?.value||'').trim();if(!name&&!value&&!unit)return null;const numeric=Number(value);return {name:name||'数据项 '+(Number(inputs[0]?.dataset.itemName)||0)+1,value:value===''?0:(Number.isFinite(numeric)?numeric:0),...(unit?{unit}:{})}}).filter(Boolean)}
    function bindItemsEditor(){const editor=$('itemsEditor');if(!editor)return;editor.onclick=(event)=>{const button=event.target.closest('[data-item-remove]');if(button)button.closest('.items-row')?.remove()}}
    function base64ToBytes(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return bytes}
    async function embedArtifact(id,kind){const host=document.querySelector('[data-artifact-host="'+id+'"]');if(!host)return;if(host.dataset.loaded==='1'){host.classList.toggle('hidden');return}setBusy(true);try{const result=await call('short.video.artifact.read',{workspace_root:state.selectedWorkspace,artifact_id:id});const bytes=base64ToBytes(result.base64);if(kind==='video'){const url=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));host.innerHTML='<video class="video-player" controls playsinline src="'+url+'"></video><p class="player-hint">正在内嵌播放 · 完整文件可点“打开”</p>'}else{const html=new TextDecoder().decode(bytes);host.innerHTML='<iframe class="inline-frame player-frame" srcdoc="'+esc(html)+'" sandbox="allow-scripts allow-same-origin"></iframe>'}host.dataset.loaded='1';host.classList.remove('hidden')}catch(error){handleError(error)}finally{setBusy(false)}}
    async function initPreviewHost(){const host=$('previewHost');const artifacts=state.detail?.artifacts||[];const artifact=state.detail?.latest_preview||artifacts.find(item=>item.kind==='preview/player')||artifacts.find(item=>item.kind==='preview/html');if(!host||!artifact)return;try{const result=await call('short.video.artifact.read',{workspace_root:state.selectedWorkspace,artifact_id:artifact.artifact_id});const html=new TextDecoder().decode(base64ToBytes(result.base64));host.innerHTML='<iframe class="inline-frame player-frame" srcdoc="'+esc(html)+'" sandbox="allow-scripts allow-same-origin"></iframe>'}catch(_error){/* 保留海报占位，可手动生成预览 */}}
    function bindProjectActions(){if($('emptyNew'))$('emptyNew').addEventListener('click',()=>openCreate());$('projectAI')?.addEventListener('click',()=>openAI());$('duplicate')?.addEventListener('click',()=>openDuplicate());$('preview')?.addEventListener('click',()=>saveAndRun('short.video.preview.player'));$('render')?.addEventListener('click',()=>saveAndRun('short.video.render.start'));$('save')?.addEventListener('click',()=>saveRecipe(false));$('addItem')?.addEventListener('click',()=>{const editor=$('itemsEditor');if(!editor)return;editor.insertAdjacentHTML('beforeend',renderItemRow({name:'',value:'',unit:''},editor.querySelectorAll('.items-row').length))});document.querySelectorAll('[data-open-artifact]').forEach(node=>node.addEventListener('click',()=>openArtifact(node.dataset.openArtifact,node.dataset.mode)));document.querySelectorAll('[data-play-artifact]').forEach(node=>node.addEventListener('click',()=>embedArtifact(node.dataset.playArtifact,'video')));document.querySelectorAll('[data-embed-artifact]').forEach(node=>node.addEventListener('click',()=>embedArtifact(node.dataset.embedArtifact,'html')));bindItemsEditor();initPreviewHost();schedulePoll(state.detail?.jobs||[])}
    async function loadProject(project){const item=typeof project==='string'?state.projects.find(p=>p.id===project):project;const id=item?.id||project;const root=item?.workspace_root||state.selectedWorkspace||state.workspace;if(!id)return;state.selected=id;state.selectedWorkspace=root;setBusy(true);try{const result=await call('short.video.project.get',{workspace_root:root,project_id:id});const extras=await Promise.all([call('short.video.feedback.list',{workspace_root:root,project_id:id}),call('short.video.candidate.list',{workspace_root:root,project_id:id})]);state.detail=result;state.feedback=extras[0].items||[];state.candidates=extras[1].items||[];state.view='projects';render()}catch(error){handleError(error)}finally{setBusy(false)}}
    function schedulePoll(jobs){clearInterval(state.polling);if((jobs||[]).some(job=>['queued','preparing','rendering','running','waiting_adapter'].includes(job.status)))state.polling=setInterval(()=>loadProject({id:state.selected,workspace_root:state.selectedWorkspace}),1800)}
    function readRecipeFromForm(){const recipe=JSON.parse(JSON.stringify(state.detail.project.recipe||{}));recipe.title=$('title').value;recipe.subtitle=$('subtitle').value;recipe.period=$('period').value;recipe.unit=$('unit').value;recipe.source=$('source').value;let extra={};const raw=$('data')?.value;if(raw&&raw.trim()){try{extra=JSON.parse(raw)}catch(error){throw new Error('Recipe JSON 格式不正确，请先修复')}};recipe.data={...(extra&&typeof extra==='object'?extra:{}),items:collectItems()};return recipe}
    async function saveRecipe(run){if(!state.detail)return;setBusy(true);try{const recipe=readRecipeFromForm();const result=await call('short.video.project.update',{workspace_root:state.selectedWorkspace,project_id:state.selected,name:state.detail.project.name,creative_brief:$('brief').value,expected_updated_at:state.detail.project.updated_at,recipe});if(result.state==='blocked')throw new Error((result.blockers||[]).map(item=>item.message).join('；')||'项目已更新，请刷新后重试');if(run){await runCapability(run)}else{await loadProject({id:state.selected,workspace_root:state.selectedWorkspace});setNotice('当前版本已保存')}}catch(error){handleError(error)}finally{setBusy(false)}}
    async function saveAndRun(capability){await saveRecipe(capability)}
    async function runCapability(capability){const result=await call(capability,{workspace_root:state.selectedWorkspace,project_id:state.selected});if(result.state==='blocked')throw new Error((result.blockers||[]).map(item=>item.message).join('；')||'操作受阻');await loadProject({id:state.selected,workspace_root:state.selectedWorkspace})}
    async function openArtifact(id,mode){try{await call('short.video.artifact.open',{workspace_root:state.selectedWorkspace,artifact_id:id,mode})}catch(error){handleError(error)}}
    function openCreate(templateID){const selected=templateID||state.catalog.templates[0]?.id||'';$('modal').innerHTML='<div class="modal"><h2>新建短视频项目</h2><p>选择一个模板作为创作起点。模板实现方式不同，但项目数据、预览和沉淀流程保持一致。</p><div class="field-grid"><div class="field full"><label>项目名称</label><input id="modalName" placeholder="例如：2026 文旅榜单"></div><div class="field"><label>模板</label><select id="modalTemplate">'+(state.catalog.templates||[]).map(item=>'<option value="'+esc(item.id)+'" '+(item.id===selected?'selected':'')+'>'+esc(item.name)+'</option>').join('')+'</select></div><div class="field"><label>风格</label><select id="modalStyle">'+(state.catalog.styles||[]).map(item=>'<option value="'+esc(item.id)+'">'+esc(item.name)+'</option>').join('')+'</select></div><div class="field full"><label>创作 brief</label><textarea id="modalBrief" class="ai-prompt" placeholder="告诉 AI 这条视频要表达什么，哪些风格规则不能变。"></textarea></div></div><div class="modal-actions"><button id="modalCancel">取消</button><button id="modalCreate" class="primary">创建并进入工作区</button></div></div>'; $('modal').classList.remove('hidden');$('modalCancel').addEventListener('click',closeModal);$('modalCreate').addEventListener('click',createProject)}
    function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
    async function createProject(){const name=$('modalName').value.trim();if(!name)return;setBusy(true);try{const result=await call('short.video.project.create',{workspace_root:state.workspace,name,template_id:$('modalTemplate').value,style_id:$('modalStyle').value,creative_brief:$('modalBrief').value});closeModal();await loadWorkspace(false);await loadProject({id:result.project.id,workspace_root:result.workspace_root})}catch(error){handleError(error)}finally{setBusy(false)}}
    function openDuplicate(){const p=state.detail?.project;if(!p)return;$('modal').innerHTML='<div class="modal"><h2>基于此项目二创</h2><p>继承当前模板、风格、Recipe 和创作 brief，只替换这一次视频需要变化的内容。</p><div class="field-grid"><div class="field full"><label>新项目名称</label><input id="modalName" value="'+esc(p.name+' · 新版本')+'"></div><div class="field"><label>模板</label><select id="modalTemplate"><option value="">沿用 '+esc(p.template_id)+'</option>'+(state.catalog.templates||[]).map(item=>'<option value="'+esc(item.id)+'">'+esc(item.name)+'</option>').join('')+'</select></div><div class="field"><label>风格</label><select id="modalStyle"><option value="">沿用 '+esc(p.style_id)+'</option>'+(state.catalog.styles||[]).map(item=>'<option value="'+esc(item.id)+'">'+esc(item.name)+'</option>').join('')+'</select></div><div class="field full"><label>本次创作 brief（可选）</label><textarea id="modalBrief" class="ai-prompt" placeholder="例如：换成 2026 年数据，节奏保持不变。"></textarea></div></div><div class="modal-actions"><button id="modalCancel">取消</button><button id="modalCreate" class="primary">创建二创项目</button></div></div>';$('modal').classList.remove('hidden');$('modalCancel').addEventListener('click',closeModal);$('modalCreate').addEventListener('click',duplicateProject)}
    async function duplicateProject(){const name=$('modalName').value.trim();if(!name)return;setBusy(true);try{const result=await call('short.video.project.duplicate',{workspace_root:state.workspace,source_workspace_root:state.selectedWorkspace,source_project_id:state.selected,name,template_id:$('modalTemplate').value,style_id:$('modalStyle').value,creative_brief:$('modalBrief').value});closeModal();await loadWorkspace(false);await loadProject({id:result.project.id,workspace_root:result.workspace_root})}catch(error){handleError(error)}finally{setBusy(false)}}
    async function openAI(){const brief=state.detail?.project?.creative_brief||'请根据短视频模板库，先推荐一个适合当前目标的模板，再明确数据字段、节奏、画面层级和预览验收标准。';try{await navigator.clipboard?.writeText(brief);const url=await native('start_builtin_ai_session',{});if(url)window.open(url,'_blank');setNotice('创作 brief 已复制，HiMind AI 会话已打开。')}catch(error){handleError(error)}}
    function renderCandidatesPage(){const items=state.candidates.length?state.candidates:[];$('content').innerHTML='<div class="page"><div data-notice class="notice hidden"></div><section class="hero"><div><div class="eyebrow">可复用资产</div><h1>把反复调教过的结果留下来</h1><p>模板变体、风格包和质量规则都会带着来源项目与反馈证据，便于后续复核和扩展源沉淀。</p></div><div class="hero-actions"><button id="candidateProjects" class="primary">回到项目</button></div></section><div class="panel"><div class="panel-head"><h2>候选资产</h2><span>当前工作区 · '+esc(state.workspace||'未选择')+'</span></div><div class="panel-body">'+(items.map(item=>'<div class="candidate-item"><header><span class="candidate-type">'+esc(item.candidate_type)+'</span><span>'+esc(date(item.created_at))+'</span></header><p>项目 '+esc(item.project_id)+' · '+esc(Object.keys(item.changes||{}).join('、'))+'</p><p>'+esc((item.evidence||[]).join('；'))+'</p></div>').join('')||'<div class="empty-line">完成项目预览和反馈后，候选资产会在这里集中显示。</div>')+'</div></div></div>';$('candidateProjects')?.addEventListener('click',()=>{state.view='projects';render()})}
    $('choose').addEventListener('click',async()=>{try{const result=await native('pick_workspace_directory');if(result?.path){state.workspaceSource='user_selected';state.workspaceBound=false;state.workspace=result.path;await loadWorkspace(true)}}catch(error){handleError(error)}});$('newProject')?.addEventListener('click',()=>openCreate());document.querySelectorAll('.nav button').forEach(node=>node.addEventListener('click',()=>{state.view=node.dataset.view;render()}));
    async function bootstrap(){render();try{const context=await native('get_plugin_view_context');const bound=String(context?.workspace_root||'').trim();if(bound){state.workspaceSource=String(context?.workspace_source||'context');state.workspaceBound=Boolean(context?.workspace_bound);state.workspace=bound;await loadWorkspace(true);return}}catch(_error){}const recent=String(localStorage.getItem('himind-short-video-workspace')||'').trim();if(recent){state.workspaceSource='recent';state.workspace=recent;await loadWorkspace(true)}}
    bootstrap();
  </script>
</body>
</html>
